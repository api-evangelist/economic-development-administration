x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    EDA is a grant-making bureau with no developer program of any kind — its own Drupal
    sitemap lists 2,805 pages and not one /developers, /api, /docs or /data.json path,
    its published data are per-state PDFs at /impact/data and XLSX/XLSM files at
    /performance/tools, and the analytical tools it points at (StatsAmerica, the
    Regional Innovation Index, U.S. Cluster Mapping) are operated by Indiana University
    and Harvard Business School rather than by EDA; the only callable host EDA runs is
    the grantee-only Salesforce portal at sfgrants.eda.gov, whose data endpoints all
    return 401.
  evidence:
    - url: https://www.eda.gov/sitemap.xml
      status: 403
    - url: http://web.archive.org/web/20260102124750/https://www.eda.gov/sitemap.xml
      status: 200
    - url: https://www.eda.gov/data.json
      status: 403
    - url: https://sfgrants.eda.gov/.well-known/openid-configuration
      status: 200
    - url: https://sfgrants.eda.gov/services/data/v62.0/
      status: 401
  checked: '2026-09-06'
